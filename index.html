<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trail Run Dashboard</title>
<link rel="icon" type="image/jpeg" href="favicon.jpg">
<script src="assets/coach-chat.js"></script>
<style>
  :root{
    /* Claude Light Theme Palette */
    --bg:#F9F8F6; --panel:#FFFFFF; --panel2:#F3F1EC; --line:#E5E1D8;
    --txt:#1A1A1A; --dim:#666666; --faint:#888888;
    --green:#2E8540; --amber:#D97757; --red:#C23B22; --blue:#3B71CA;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#EAE8E3;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       display:flex;justify-content:center;position:relative;}
  .app{width:100%;max-width:430px;background:var(--bg);min-height:100vh;padding:14px 14px 28px;position:relative;}
  .mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  header{padding:6px 2px 12px; padding-right:60px;} /* leave space for lang toggle */
  h1{font-size:20px;font-weight:700;letter-spacing:.2px}
  h1 .quote{color:var(--dim);font-weight:500}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{font-size:11px;color:var(--dim);background:var(--panel);border:1px solid var(--line);
        border-radius:999px;padding:3px 9px}
  .photos{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
  .photos button{flex:0 0 auto;border:0;padding:0;background:none;cursor:zoom-in;scroll-snap-align:start;border-radius:10px;overflow:hidden}
  .photos img{display:block;height:150px;width:auto;max-width:260px;object-fit:cover;background:var(--panel2)}
  .photos.one img{height:auto;width:100%;max-width:100%;max-height:340px}
  .photos.one button{flex:1 1 auto}
  #lightbox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
  #lightbox[hidden]{display:none}
  #lightbox img{max-width:100%;max-height:calc(100vh - 110px);object-fit:contain;border-radius:8px}
  #lightbox .lb-cap{color:#ddd;font-size:12px;margin-top:10px;text-align:center;max-width:600px}
  #lightbox .lb-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:999px;width:40px;height:40px;font-size:20px;cursor:pointer}
  #lightbox .lb-prev{left:10px} #lightbox .lb-next{right:10px}
  #lightbox .lb-close{position:absolute;top:12px;right:14px;background:none;border:0;color:#fff;font-size:26px;cursor:pointer}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--faint);margin-bottom:10px}
  svg{display:block;width:100%;height:auto;touch-action:none;}
  
  #map-container { position: relative; }
  #map-tooltip {
    position: absolute; display: none; pointer-events: none;
    background: var(--txt); color: #fff; padding: 5px 10px;
    border-radius: 6px; font-size: 12px; font-weight: 600;
    transform: translate(-50%, -100%); margin-top: -12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15); z-index: 10;
    white-space: nowrap; font-family: ui-monospace,SFMono-Regular,monospace;
  }
  #map-tooltip::after {
    content: ""; position: absolute; top: 100%; left: 50%;
    margin-left: -5px; border-width: 5px; border-style: solid;
    border-color: var(--txt) transparent transparent transparent;
  }

  #profile-container { position: relative; }
  #profile-tooltip {
    position: absolute; display: none; pointer-events: none;
    background: var(--txt); color: #fff; padding: 5px 10px;
    border-radius: 6px; font-size: 12px; font-weight: 600;
    transform: translate(-50%, -100%); margin-top: -12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15); z-index: 10;
    white-space: nowrap; font-family: ui-monospace,SFMono-Regular,monospace;
  }
  #profile-tooltip::after {
    content: ""; position: absolute; top: 100%; left: 50%;
    margin-left: -5px; border-width: 5px; border-style: solid;
    border-color: var(--txt) transparent transparent transparent;
  }

  .ann{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
       padding:10px 12px;margin-top:8px;transition:border-color .3s}
  .ann.flash{border-color:var(--amber)}
  .ann .n{flex:0 0 24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
          font-size:12px;font-weight:800;color:#ffffff;margin-top:2px}
  .ann .t{font-size:13px;font-weight:700}
  .ann .m{font-size:11px;color:var(--dim);margin-top:1px}
  .ann .d{font-size:12px;color:var(--dim);line-height:1.45;margin-top:5px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center}
  .stat .v{font-size:15px;font-weight:700}
  .stat .k{font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
  .zrow{display:flex;align-items:center;gap:8px;margin-top:6px}
  .zrow .zl{width:26px;font-size:11px;color:var(--dim)}
  .zrow .zb{flex:1;height:14px;background:var(--panel2);border-radius:4px;overflow:hidden}
  .zrow .zf{height:100%;border-radius:4px}
  .zrow .zp{width:38px;text-align:right;font-size:11px;color:var(--dim)}
  footer{margin-top:16px;font-size:10.5px;color:var(--faint);line-height:1.6;padding:0 2px}
  #status{padding:40px 12px;text-align:center;color:var(--dim);font-size:13px}

  .lang-toggle {
    position: absolute; top: 14px; right: 14px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 2px; display: flex; gap: 2px;
  }
  .lang-btn {
    border: none; background: transparent; color: var(--dim);
    font-size: 11px; padding: 4px 8px; border-radius: 4px; cursor: pointer;
    font-weight: 600;
  }
  .lang-btn.active { background: var(--txt); color: #fff; }
  .race{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;margin:0 60px 4px 0;
        border-left:3px solid var(--amber);transition:border-color .2s, transform .2s}
  .race:hover{border-color:var(--amber);transform:translateY(-1px)}
  .race .rk{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--amber);font-weight:700}
  .race .rn{font-size:15px;font-weight:700;margin-top:1px}
  .race .rm{font-size:11px;color:var(--dim);margin-top:2px}
  .race .rc{margin-left:auto;text-align:center;flex:0 0 auto}
  .race .rc b{display:block;font-size:22px;line-height:1;color:var(--amber)}
  .race .rc small{font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px}

  /* Phone: one column; .col wrappers vanish and "order" sets the sequence. */
  #content{display:flex;flex-direction:column}
  .col{display:contents}
  .o-map{order:1} #photos-card{order:1} #annotations{order:2} .o-prof{order:3} .o-sum{order:4} .o-zones{order:5} #chat-card{order:6} #footer{order:7}
  #chat-card{--cc-ink:var(--txt);--cc-dim:var(--dim);--cc-line:var(--line);--cc-bg:var(--bg);--cc-soft:var(--panel2)}
  #chat-card .cc-title{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--faint);font-weight:700}

  /* Desktop: map and charts on the left, coaching pins and chat on the right. */
  @media (min-width: 960px){
    body{padding:24px}
    .app{max-width:1280px;border-radius:18px;padding:22px 26px 30px;min-height:auto}
    #content{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(360px,1fr);gap:0 22px;align-items:start}
    #content>header,#footer{grid-column:1/-1}
    #content>header{padding-right:90px}
    #run-selector{max-width:460px}
    h1{font-size:26px}
    .col{display:block}
    .col-side{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;padding-right:4px}
    .col-side #annotations .ann:first-child{margin-top:12px}
    #chat-card{--cc-max:340px}
    .race{margin-right:90px}
  }
</style>
</head>
<body>
<div class="app">
  <div class="lang-toggle">
    <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
    <button class="lang-btn" id="btn-zh" onclick="setLang('zh')">ZH</button>
  </div>

  <a class="card race" id="race-card" hidden></a>

  <div id="status" data-i18n="loading">Loading run…</div>
  <div id="content" style="display:none">
    <header>
      <h1><span class="quote">“</span><span id="title"></span><span class="quote">”</span></h1>
      <select id="run-selector" style="margin-top: 10px; width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); color: var(--txt); font-family: inherit; font-size: 13px; cursor: pointer;"></select>
      <div class="chips" id="chips"></div>
    </header>

    <div class="col col-main">
    <div class="card o-map">
      <h2><span data-i18n="route">Route · heart-rate track on terrain contours</span> <span id="contour-note"></span></h2>
      <div id="map-container">
        <svg id="map" role="img" aria-label="Contour map with heart-rate colored route" style="touch-action:none;"></svg>
        <div id="map-tooltip"></div>
      </div>
    </div>

    <div class="card" id="photos-card" hidden>
      <h2 data-i18n="photos">Photos</h2>
      <div class="photos" id="photos"></div>
    </div>

    <div class="card o-prof">
      <h2 data-i18n="elev_hr">Elevation &amp; heart rate</h2>
      <div id="profile-container">
        <svg id="profile" viewBox="0 0 360 150" role="img" aria-label="Elevation and heart rate profile" style="touch-action:none;"></svg>
        <div id="profile-tooltip"></div>
      </div>
      <div style="display:flex;gap:14px;margin-top:6px;font-size:10.5px;color:var(--dim)">
        <span><span style="color:var(--dim)">■</span> <span data-i18n="elevation">elevation</span></span>
        <span><span style="color:var(--amber)">■</span> <span data-i18n="heart_rate">heart rate</span></span>
        <span style="margin-left:auto" data-i18n="pins">dots = coaching pins</span>
      </div>
    </div>

    <div class="card o-sum">
      <h2 data-i18n="summary">Summary</h2>
      <div class="grid mono" id="summary"></div>
    </div>

    <div class="card o-zones">
      <h2 data-i18n="zones">Time in HR zone</h2>
      <div id="zones"></div>
    </div>

    </div>

    <div class="col col-side">
      <div id="annotations"></div>
      <div class="card" id="chat-card"></div>
    </div>

    <footer id="footer"></footer>
  </div>
  <div id="lightbox" hidden role="dialog" aria-modal="true">
    <button class="lb-close" aria-label="Close">×</button>
    <button class="lb-btn lb-prev" aria-label="Previous">‹</button>
    <img alt="">
    <div class="lb-cap"></div>
    <button class="lb-btn lb-next" aria-label="Next">›</button>
  </div>
</div>

<script>
const I18N = {
  en: {
    loading: "Loading run…", error: "Could not load run",
    route: "Route · heart-rate track on terrain contours", contour_dem: "DEM", contour_track: "from track altitude",
    elev_hr: "Elevation & heart rate", summary: "Summary", zones: "Time in HR zone", photos: "Photos",
    elevation: "elevation", heart_rate: "heart rate", pins: "dots = coaching pins",
    start: "START", effort: "EFFORT BUILDS", mid: "MID CLIMB", summit: "SUMMIT",
    drop: "STEEP DROP", fade: "LEGS FADING", finish: "FINISH",
    km: "km", moving: "moving", pace: "/km", elev_m: "elev m",
    avg_hr: "avg hr", max_hr: "max hr", kcal: "kcal", points: "points",
    start_det: "Start of the effort. Watch how quickly the gradient and heart rate ramp in the opening stretch.",
    effort_det: "Heart rate climbing early. Settle the pace here so the effort stays controlled through the main climb.",
    mid_det: "Roughly midway up the climb. Hold this line — control usually breaks near the top.",
    summit_det: "m of gain behind you, top of the loop. From here it's the descent — its own kind of hard.",
    drop_det: "Sharpest downhill of the run. Peak eccentric quad load — shorten stride, lift cadence, don't brake hard.",
    fade_det: "Pace bleeds back as the descent flattens and fatigue lands. Keep turnover up through the final rollers.",
    finish_det: "Back near the trailhead. A steady out-and-back climb.",
    source: "Source: Strava activity",
    footer_text: "Streams fetched at high resolution from Strava by a GitHub Actions workflow.<br>Contours come from public Terrarium DEM tiles (© Mapzen, USGS, NOAA and others; <a href=\"https://github.com/tilezen/joerd/blob/master/docs/attribution.md\">credits</a>); the interval adapts to the terrain. Route color = heart rate (green ≤145 → red ≥175 bpm).",
    chat_title: "AI Coach (OpenRouter)", api_key: "API Key:", model: "Model:", chat_placeholder: "Ask about your run...", send: "Send",
    select_run: "-- Select a previous run --",
    race_next: "Next race", race_done: "Race roadbook", race_days: "days", race_today: "Race day",
    race_open: "Course, pacing & photo stops →",
    key_note: "Kept only in this browser tab; cleared when you close it."
  },
  zh: {
    loading: "正在加载数据…", error: "无法加载数据",
    route: "路线 · 心率着色轨迹与地形等高线", contour_dem: "DEM 地形", contour_track: "由轨迹海拔推算",
    elev_hr: "海拔与心率曲线", summary: "数据摘要", zones: "心率区间时长", photos: "照片",
    elevation: "海拔", heart_rate: "心率", pins: "圆点 = 关键分析点",
    start: "起点", effort: "发力期", mid: "半坡", summit: "顶峰",
    drop: "陡降", fade: "后半程掉速", finish: "终点",
    km: "公里", moving: "移动时间", pace: "配速", elev_m: "累计爬升",
    avg_hr: "平均心率", max_hr: "最大心率", kcal: "卡路里", points: "数据点",
    start_det: "发力开始。注意在起步阶段坡度和心率是如何迅速攀升的。",
    effort_det: "心率过早攀升。在这里稳住配速，以便在主爬升段保持控制。",
    mid_det: "大约在爬升的中段。保持这个节奏——通常在接近顶部时容易崩溃。",
    summit_det: "米爬升已在身后，环线的最高点。从这里开始是下坡——另一种艰难。",
    drop_det: "最陡的下坡。股四头肌离心负荷达到顶峰——缩短步幅，提高步频，不要猛踩刹车。",
    fade_det: "随着下坡变缓和疲劳袭来，配速开始下降。在最后的起伏路段保持步频。",
    finish_det: "回到起点附近。一次稳定的折返爬升训练。",
    source: "数据来源: Strava 活动",
    footer_text: "由 GitHub Actions 从 Strava 获取高精度轨迹数据。<br>等高线来自公开 Terrarium DEM 地形瓦片（© Mapzen、USGS、NOAA 等；<a href=\"https://github.com/tilezen/joerd/blob/master/docs/attribution.md\">数据来源</a>），等高距随地形自动调整。轨迹颜色 = 心率 (绿色 ≤145 → 红色 ≥175 bpm)。",
    chat_title: "AI 教练 (OpenRouter)", api_key: "API 密钥:", model: "模型:", chat_placeholder: "询问关于这次跑步的建议...", send: "发送",
    select_run: "-- 选择历史记录 --",
    race_next: "下一场比赛", race_done: "赛事路书", race_days: "天", race_today: "比赛日",
    race_open: "路线、配速与摄影点 →",
    key_note: "只保存在当前标签页，关闭后即清除。"
  }
};

// Race roadbooks under races/<slug>/. The card shows from now until a week after race day.
const RACES = [
  { slug: "catalina-10k-2026-11-14", date: "2026-11-14",
    name: { en: "Catalina 10K", zh: "Catalina 10K" },
    place: { en: "Avalon, Catalina Island · Nov 14", zh: "加州 Catalina 岛 Avalon · 11月14日" } }
];
function renderRaceCard() {
  const card = document.getElementById("race-card");
  const today = new Date(); today.setHours(0,0,0,0);
  const race = RACES
    .map(r => ({ ...r, days: Math.round((new Date(r.date + "T00:00:00") - today) / 86400000) }))
    .filter(r => r.days >= -7)
    .sort((a, b) => a.days - b.days)[0];
  if (!race) { card.hidden = true; return; }
  card.href = `races/${race.slug}/`;
  const count = race.days > 0
    ? `<b class="mono">${race.days}</b><small>${t("race_days")}</small>`
    : race.days === 0 ? `<b>🏁</b><small>${t("race_today")}</small>` : `<b>✓</b>`;
  card.innerHTML =
    `<div><div class="rk">${race.days >= 0 ? t("race_next") : t("race_done")}</div>` +
    `<div class="rn">${race.name[LANG]}</div><div class="rm">${race.place[LANG]}</div>` +
    `<div class="rm" style="color:var(--txt)">${t("race_open")}</div></div>` +
    `<div class="rc">${count}</div>`;
  card.hidden = false;
}

let LANG = localStorage.getItem("lang") || "zh";
function t(key) { return I18N[LANG][key] || key; }
function setLang(l) {
  LANG = l; localStorage.setItem("lang", l);
  document.getElementById("btn-en").className = "lang-btn" + (l==="en"?" active":"");
  document.getElementById("btn-zh").className = "lang-btn" + (l==="zh"?" active":"");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = t(el.getAttribute("data-i18n")); });
  document.querySelectorAll("[data-placeholder-i18n]").forEach(el => { el.placeholder = t(el.getAttribute("data-placeholder-i18n")); });
  renderRaceCard();

  if (window.runsIndex) populateRunSelector(window.runsIndex);
  if(D) { renderMeta(); renderAnnotations(); renderZones(); }
  if (typeof chat !== "undefined") chat.setLang();
  renderContourNote();
}

// With no ?id=, show the newest run from runs/index.json.
const qs = new URLSearchParams(location.search);
let RUN_ID = qs.get("id");

const TCOLOR = {neutral:"#3B71CA", target:"#2E8540", warning:"#D97757", critical:"#C23B22"};

let D, WAY;
let latMin,latMax,lngMin,lngMax,KX,KY,W,H,PAD,PW,PH,N,RX,RY;

function populateRunSelector(indexData) {
  const sel = document.getElementById("run-selector");
  sel.innerHTML = `<option value="">${t("select_run")}</option>`;
  indexData.forEach(r => {
    const opt = document.createElement("option");
    opt.value = r.id;
    const where = r.place ? ` · ${r.place[LANG] || r.place.en}` : "";
    opt.textContent = `${r.date.split(" ")[0]} · ${r.distance_km} ${t("km")} · ${r.name}${where}${r.photos ? " · 📷" : ""}`;
    if(r.id == RUN_ID) opt.selected = true;
    sel.appendChild(opt);
  });
}

// Fetch run index (also decides the default run)
const runsIndexReady = fetch('runs/index.json', {cache:"no-cache"})
  .then(r => r.ok ? r.json() : [])
  .catch(() => [])
  .then(data => {
    window.runsIndex = data;
    if (!RUN_ID && data.length) RUN_ID = String(data[0].id);
    populateRunSelector(data);
    return data;
  });

document.getElementById("run-selector").addEventListener("change", (e) => {
  if(e.target.value) window.location.search = '?id=' + e.target.value;
});

function computeBounds(){
  const lats = D.location.map(p=>p[0]), lngs = D.location.map(p=>p[1]);
  latMin=Math.min(...lats); latMax=Math.max(...lats);
  lngMin=Math.min(...lngs); lngMax=Math.max(...lngs);
  const midLat=(latMin+latMax)/2;
  KX = Math.cos(midLat*Math.PI/180)*111320; KY = 110900;
  W=(lngMax-lngMin)*KX; H=(latMax-latMin)*KY;
  PAD=0.14*Math.max(W,H);
  PW=W+2*PAD; PH=H+2*PAD;
  N=D.location.length;
  RX=D.location.map(p=>(p[1]-lngMin)*KX);
  RY=D.location.map(p=>(latMax-p[0])*KY);
}

function buildWaypoints(){
  if (D.meta && D.meta.waypoints && D.meta.waypoints.length > 0) {
    WAY = D.meta.waypoints;
    return;
  }
  const n=N;
  let sIdx=0, sAlt=D.alt[0];
  for(let i=0;i<n;i++){ if(D.alt[i]>sAlt){sAlt=D.alt[i];sIdx=i;} }
  const climbMid = Math.round(sIdx/2);
  let steepIdx=sIdx, steepG=0;
  for(let i=sIdx;i<n;i++){ if(D.grade[i]<steepG){steepG=D.grade[i];steepIdx=i;} }
  const q8 = Math.max(1, Math.round(n*0.08));
  const fade = Math.round(sIdx + (n-1-sIdx)*0.85);
  const gain = Math.round(Math.max(...D.alt) - D.alt[0]);
  
  WAY = [
    {idx:0, type:"neutral", tKey:"start", dKey:"start_det", altStr:Math.round(D.alt[0])},
    {idx:q8, type:"warning", tKey:"effort", dKey:"effort_det"},
    {idx:climbMid, type:"target", tKey:"mid", dKey:"mid_det"},
    {idx:sIdx, type:"neutral", tKey:"summit", dKey:"summit_det", gain:gain, altStr:Math.round(sAlt)},
    {idx:steepIdx, type:"critical", tKey:"drop", dKey:"drop_det"},
    {idx:fade, type:"warning", tKey:"fade", dKey:"fade_det"},
    {idx:n-1, type:"neutral", tKey:"finish", dKey:"finish_det"}
  ];
}

function hrColor(hr){
  const t_val = Math.max(0, Math.min(1, (hr-145)/30));
  if (t_val < 0.5) {
    const f = t_val * 2;
    const r = Math.round(46 + f*(217-46)), g = Math.round(133 + f*(119-133)), b = Math.round(64 + f*(87-64));
    return `rgb(${r},${g},${b})`;
  } else {
    const f = (t_val - 0.5) * 2;
    const r = Math.round(217 + f*(194-217)), g = Math.round(119 + f*(59-119)), b = Math.round(87 + f*(34-87));
    return `rgb(${r},${g},${b})`;
  }
}

function paceStr(v){
  if(!v || v<0.3) return "—";
  const s = 1000/v, m = Math.floor(s/60), ss = Math.round(s%60);
  return `${m}:${String(ss).padStart(2,"0")}`;
}
function localizeText(v){
  if(v==null) return "";
  if(typeof v === "string") return v;
  if(typeof v === "object") return LANG==="zh" ? (v.zh || v.en || "") : (v.en || v.zh || "");
  return String(v);
}

function buildField(){
  const nx=73, ny=73, dx=PW/(nx-1), dy=PH/(ny-1), g=[];
  for(let j=0;j<ny;j++){
    const row=[];
    for(let i=0;i<nx;i++){
      const x=-PAD+i*dx, y=-PAD+j*dy;
      let num=0, den=0;
      for(let k=0;k<N;k+=3){
        const ddx=x-RX[k], ddy=y-RY[k], d2=ddx*ddx+ddy*ddy;
        const w=1/Math.pow(d2+4,1.25);
        num+=w*D.alt[k]; den+=w;
      }
      row.push(num/den);
    }
    g.push(row);
  }
  for(let s=0;s<2;s++){
    const g2=g.map(r=>r.slice());
    for(let j=1;j<ny-1;j++)for(let i=1;i<nx-1;i++)
      g2[j][i]=(g[j][i]*4+g[j][i-1]+g[j][i+1]+g[j-1][i]+g[j+1][i])/8;
    for(let j=0;j<ny;j++)for(let i=0;i<nx;i++)g[j][i]=g2[j][i];
  }
  return {g,nx,ny,dx,dy};
}

// Real terrain: Terrarium DEM tiles (CORS-enabled public bucket), sampled on the same grid
// as buildField(). Falls back to buildField() (track-altitude IDW) if tiles can't load.
const TILE_URL = (z,x,y) => `https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${x}/${y}.png`;
async function buildFieldDEM(){
  const nx = 121, dx = PW/(nx-1), ny = Math.max(2, Math.round(PH/dx)+1), dy = PH/(ny-1);
  const midLat = (latMin+latMax)/2, rad = Math.PI/180;
  const tileX = (lng,z) => (lng+180)/360*2**z;
  const tileY = (lat,z) => (1 - Math.log(Math.tan(lat*rad) + 1/Math.cos(lat*rad))/Math.PI)/2*2**z;
  const west = lngMin-PAD/KX, east = lngMax+PAD/KX, north = latMax+PAD/KY, south = latMin-PAD/KY;
  // Finest zoom (<=15) whose pixels are no smaller than a quarter grid cell, using at most 16 tiles.
  let z = 15;
  for (; z > 8; z--) {
    const mpp = 156543.03*Math.cos(midLat*rad)/2**z;
    const n = (Math.floor(tileX(east,z))-Math.floor(tileX(west,z))+1)*(Math.floor(tileY(south,z))-Math.floor(tileY(north,z))+1);
    if (mpp >= dx/4 && n <= 16) break;
  }
  const tx0 = Math.floor(tileX(west,z)), tx1 = Math.floor(tileX(east,z));
  const ty0 = Math.floor(tileY(north,z)), ty1 = Math.floor(tileY(south,z));
  const cw = (tx1-tx0+1)*256, ch = (ty1-ty0+1)*256;
  const canvas = document.createElement("canvas"); canvas.width = cw; canvas.height = ch;
  const ctx = canvas.getContext("2d", {willReadFrequently:true});
  const jobs = [];
  for (let ty=ty0; ty<=ty1; ty++) for (let tx=tx0; tx<=tx1; tx++) {
    jobs.push(new Promise((ok, fail) => {
      const img = new Image(); img.crossOrigin = "anonymous";
      img.onload = () => { ctx.drawImage(img, (tx-tx0)*256, (ty-ty0)*256); ok(); };
      img.onerror = () => fail(new Error("DEM tile failed"));
      img.src = TILE_URL(z,tx,ty);
    }));
  }
  await Promise.all(jobs);
  const px = ctx.getImageData(0,0,cw,ch).data;
  const elevAt = (x,y) => { const i = (y*cw+x)*4; return px[i]*256 + px[i+1] + px[i+2]/256 - 32768; };
  const g = [];
  for (let j=0; j<ny; j++) {
    const row = [];
    for (let i=0; i<nx; i++) {
      const lng = lngMin + (-PAD+i*dx)/KX, lat = latMax - (-PAD+j*dy)/KY;
      const fx = Math.min(cw-1.001, Math.max(0, (tileX(lng,z)-tx0)*256-0.5));
      const fy = Math.min(ch-1.001, Math.max(0, (tileY(lat,z)-ty0)*256-0.5));
      const x0 = Math.floor(fx), y0 = Math.floor(fy), u = fx-x0, v = fy-y0;
      row.push(elevAt(x0,y0)*(1-u)*(1-v) + elevAt(x0+1,y0)*u*(1-v) + elevAt(x0,y0+1)*(1-u)*v + elevAt(x0+1,y0+1)*u*v);
    }
    g.push(row);
  }
  // One light smoothing pass so 1-2 m contours don't zigzag on tile pixels.
  const g2 = g.map(r=>r.slice());
  for (let j=1;j<ny-1;j++) for (let i=1;i<nx-1;i++) g2[j][i] = (g[j][i]*4+g[j][i-1]+g[j][i+1]+g[j-1][i]+g[j+1][i])/8;
  return {g:g2, nx, ny, dx, dy};
}

let CONTOUR = null;  // {step, src} for the card title
async function drawContours(gCont, el){
  let f, src = "dem";
  try { f = await buildFieldDEM(); } catch (e) { console.warn(e); f = buildField(); src = "track"; }
  const {g,nx,ny,dx,dy} = f;
  let lo = Infinity, hi = -Infinity;
  for (const r of g) for (const v of r) { if (v<lo) lo=v; if (v>hi) hi=v; }
  // Interval: the largest "nice" step that still gives at least ~6 lines across the map.
  const STEPS = [100,50,20,10,5,2,1];
  const step = STEPS.find(st => (hi-lo)/st >= 6) || 1;
  const major = step*5, fs = Math.max(PW,PH)/90;
  for (let L = Math.ceil(lo/step)*step; L <= hi; L += step) {
    const isMajor = Math.abs(L % major) < 1e-6;
    const segs = contourSegs(g,nx,ny,dx,dy,L);
    let dstr = "", best = null, bestLen = 0;
    for (const [p,q] of segs) {
      dstr += `M${p[0].toFixed(1)} ${p[1].toFixed(1)}L${q[0].toFixed(1)} ${q[1].toFixed(1)}`;
      const len = Math.hypot(q[0]-p[0], q[1]-p[1]);
      if (len > bestLen) { bestLen = len; best = [p,q]; }
    }
    if (!dstr) continue;
    gCont.appendChild(el("path",{d:dstr, stroke:isMajor?"#CFC9BE":"#E0DCD3",
      "stroke-width":isMajor?3.2:2.2, "stroke-linecap":"round"}));
    if (isMajor && best) {
      const [p,q] = best, mx = (p[0]+q[0])/2, my = (p[1]+q[1])/2;
      let ang = Math.atan2(q[1]-p[1], q[0]-p[0])*180/Math.PI;
      if (ang > 90) ang -= 180; if (ang < -90) ang += 180;
      const tx = el("text",{x:mx, y:my, transform:`rotate(${ang} ${mx} ${my})`, "font-size":fs,
        fill:"#A39E93", "text-anchor":"middle", "paint-order":"stroke", stroke:"#F9F8F6", "stroke-width":fs/4});
      tx.textContent = `${L} m`;
      gCont.appendChild(tx);
    }
  }
  CONTOUR = {step, src};
  renderContourNote();
}
function renderContourNote(){
  const n = document.getElementById("contour-note");
  if (n) n.textContent = CONTOUR ? `(${CONTOUR.step} m · ${t(CONTOUR.src==="dem" ? "contour_dem" : "contour_track")})` : "";
}

function contourSegs(g,nx,ny,dx,dy,level){
  const segs=[];
  for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){
    const a=g[j][i], b=g[j][i+1], c=g[j+1][i+1], d=g[j+1][i];
    let cs=0;
    if(a>level)cs|=8; if(b>level)cs|=4; if(c>level)cs|=2; if(d>level)cs|=1;
    if(cs===0||cs===15) continue;
    const x0=-PAD+i*dx, y0=-PAD+j*dy;
    const L=(v0,v1)=>(level-v0)/(v1-v0);
    const top=[x0+dx*L(a,b),y0], right=[x0+dx,y0+dy*L(b,c)],
          bot=[x0+dx*L(d,c),y0+dy], left=[x0,y0+dy*L(a,d)];
    const add=(p,q)=>segs.push([p,q]);
    switch(cs){
      case 1: add(left,bot); break;
      case 2: add(bot,right); break;
      case 3: add(left,right); break;
      case 4: add(top,right); break;
      case 5: add(top,left); add(bot,right); break;
      case 6: add(top,bot); break;
      case 7: add(top,left); break;
      case 8: add(top,left); break;
      case 9: add(top,bot); break;
      case 10: add(top,right); add(left,bot); break;
      case 11: add(top,right); break;
      case 12: add(left,right); break;
      case 13: add(bot,right); break;
      case 14: add(left,bot); break;
    }
  }
  return segs;
}

function renderMap(){
  const svg = document.getElementById("map");
  svg.innerHTML=""; // clear previous
  svg.setAttribute("viewBox",`0 0 ${PW} ${PH}`);
  const ns = "http://www.w3.org/2000/svg";
  const el = (t,at)=>{const e=document.createElementNS(ns,t);for(const k in at)e.setAttribute(k,at[k]);return e;};

  const gCont = el("g",{transform:`translate(${PAD},${PAD})`,fill:"none"});
  svg.appendChild(gCont);
  drawContours(gCont, el);

  let under="";
  for(let i=0;i<N;i++) under+=`${i?"L":"M"}${(RX[i]+PAD).toFixed(1)} ${(RY[i]+PAD).toFixed(1)}`;
  svg.appendChild(el("path",{d:under,fill:"none",stroke:"#1A1A1A","stroke-width":22,
    opacity:.2,"stroke-linecap":"round","stroke-linejoin":"round"}));

  for(let i=0;i<N-1;i++){
    const hr=(D.hr[i]+D.hr[i+1])/2;
    svg.appendChild(el("line",{
      x1:RX[i]+PAD, y1:RY[i]+PAD, x2:RX[i+1]+PAD, y2:RY[i+1]+PAD,
      stroke:hrColor(hr),"stroke-width":11,"stroke-linecap":"round"}));
  }

  WAY.forEach((w,k)=>{
    const x=RX[w.idx]+PAD, y=RY[w.idx]+PAD, c=TCOLOR[w.type];
    const gMark=el("g",{cursor:"pointer"});
    // Increased size to r=22 for better mobile tapping
    gMark.appendChild(el("circle",{cx:x,cy:y,r:22,fill:c,stroke:"#FFFFFF","stroke-width":5}));
    const tx=el("text",{x:x,y:y+8,"font-size":24,"font-weight":800,fill:"#FFFFFF","text-anchor":"middle"});
    tx.textContent=k+1;
    gMark.appendChild(tx);
    gMark.addEventListener("click",()=>{
      const card=document.getElementById("ann"+(k+1));
      card.scrollIntoView({behavior:"smooth",block:"center"});
      card.classList.add("flash");
      setTimeout(()=>card.classList.remove("flash"),1200);
    });
    svg.appendChild(gMark);
  });
  
  const tooltip = document.getElementById("map-tooltip");
  const container = document.getElementById("map-container");
  
  function handlePointer(e) {
    if (!N) return;
    const rect = svg.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const scaleX = PW / rect.width;
    const scaleY = PH / rect.height;
    const svgX = x * scaleX;
    const svgY = y * scaleY;
    
    let minDist = Infinity, bestIdx = 0;
    for(let i=0;i<N;i+=2) { 
      const dx = (RX[i]+PAD) - svgX;
      const dy = (RY[i]+PAD) - svgY;
      const d2 = dx*dx + dy*dy;
      if(d2 < minDist) { minDist = d2; bestIdx = i; }
    }
    
    if(minDist < 4000) {
      const px = (RX[bestIdx]+PAD) / scaleX;
      const py = (RY[bestIdx]+PAD) / scaleY;
      tooltip.style.left = px + "px";
      tooltip.style.top = py + "px";
      tooltip.innerHTML = `HR ${D.hr[bestIdx]} <span style="color:#A39E93;margin:0 4px">|</span> ${paceStr(D.vel[bestIdx])}${t('pace')}`;
      tooltip.style.display = "block";
    } else {
      tooltip.style.display = "none";
    }
  }
  
  container.addEventListener("mousemove", handlePointer);
  container.addEventListener("touchmove", (e) => {
    if(tooltip.style.display === "block") e.preventDefault();
    handlePointer(e.touches[0]);
  }, {passive: false});
  container.addEventListener("mouseleave", () => tooltip.style.display="none");
  container.addEventListener("touchend", () => tooltip.style.display="none");
}

function renderAnnotations(){
  const wrap=document.getElementById("annotations");

  const kmAt = i => (D.dist[i]/1000).toFixed(2);
  WAY.forEach((w,k)=>{
    const i=w.idx, c=TCOLOR[w.type] || TCOLOR["neutral"];
    const div=document.createElement("div");
    div.className="ann"; div.id="ann"+(k+1);
    
    let subText = "";
    if (w.subText) {
      subText = localizeText(w.subText);
    } else if (w.tKey==="start") subText = `${w.altStr} m`;
    else if (w.tKey==="summit") subText = `${kmAt(i)} ${t('km')} · ${w.altStr} m`;
    else if (w.tKey==="drop") subText = `${kmAt(i)} ${t('km')} · grade ${D.grade[i]}%`;
    else subText = `${kmAt(i)} ${t('km')}`;
    
    let detailText = "";
    if (w.tip) {
      detailText = localizeText(w.tip);
    } else if (D.meta.ai_tips && D.meta.ai_tips[k]) {
      detailText = localizeText(D.meta.ai_tips[k]);
    } else {
      detailText = t(w.dKey);
      if(w.tKey==="summit") detailText = `+${w.gain} ` + detailText;

    let titleText = w.title ? localizeText(w.title) : t(w.tKey);

    div.innerHTML=
      `<div class="n" style="background:${c}">${k+1}</div>
       <div>

         <div class="m mono">${subText}${hrStr} · ${paceStr(D.vel[i])}${t('pace')}</div>
         <div class="d">${detailText}</div>
       </div>`;
    wrap.appendChild(div);
  });
}

function renderProfile(){
  const svg=document.getElementById("profile");
  svg.innerHTML="";
  const ns="http://www.w3.org/2000/svg";
  const el=(t,at)=>{const e=document.createElementNS(ns,t);for(const k in at)e.setAttribute(k,at[k]);return e;};
  const ml=34, mr=10, mt=12, mb=20, pw=360-ml-mr, ph=150-mt-mb;
  const dMax=D.dist[N-1];
  const altMin=Math.min(...D.alt), altMax=Math.max(...D.alt);
  const aLo=Math.floor((altMin-5)/10)*10, aHi=Math.ceil((altMax+5)/10)*10;
  const hrMin=Math.min(...D.hr), hrMax=Math.max(...D.hr);
  const hLo=Math.max(0,hrMin-10), hHi=hrMax+10;
  const x=d=>ml+d/dMax*pw;
  const yA=a=>mt+ph-(a-aLo)/(aHi-aLo)*ph;
  const yH=h=>mt+ph-(h-hLo)/(hHi-hLo)*ph;

  [aLo,Math.round((aLo+aHi)/2),aHi].forEach(v=>{
    svg.appendChild(el("line",{x1:ml,x2:360-mr,y1:yA(v),y2:yA(v),stroke:"var(--line)","stroke-width":1}));
    const tx=el("text",{x:4,y:yA(v)+3,"font-size":9,fill:"var(--dim)"});
    tx.textContent=v; svg.appendChild(tx);
  });

  let area=`M${x(0)} ${yA(D.alt[0])}`;
  for(let i=1;i<N;i++) area+=`L${x(D.dist[i])} ${yA(D.alt[i])}`;
  area+=`L${x(dMax)} ${yA(aLo)}L${x(0)} ${yA(aLo)}Z`;
  svg.appendChild(el("path",{d:area,fill:"var(--line)",opacity:.5}));
  let ridge=`M${x(0)} ${yA(D.alt[0])}`;
  for(let i=1;i<N;i++) ridge+=`L${x(D.dist[i])} ${yA(D.alt[i])}`;
  svg.appendChild(el("path",{d:ridge,fill:"none",stroke:"var(--dim)","stroke-width":1.5}));

  for(let i=0;i<N-1;i++){
    svg.appendChild(el("line",{
      x1:x(D.dist[i]),y1:yH(D.hr[i]),x2:x(D.dist[i+1]),y2:yH(D.hr[i+1]),
      stroke:hrColor((D.hr[i]+D.hr[i+1])/2),"stroke-width":1.6}));
  }

  WAY.forEach((w, k)=>{
    const circ = el("circle",{cx:x(D.dist[w.idx]),cy:yA(D.alt[w.idx]),r:5.5,
      fill:TCOLOR[w.type],stroke:"#FFFFFF","stroke-width":2,cursor:"pointer"});
    circ.addEventListener("click",()=>{
      const card=document.getElementById("ann"+(k+1));
      card.scrollIntoView({behavior:"smooth",block:"center"});
      card.classList.add("flash");
      setTimeout(()=>card.classList.remove("flash"),1200);
    });
    svg.appendChild(circ);
  });

  const kmMax=Math.floor(dMax/1000);
  for(let kmm=0;kmm<=kmMax;kmm++){
    const tx=el("text",{x:x(kmm*1000),y:146,"font-size":9,fill:"var(--dim)","text-anchor":"middle"});
    tx.textContent=kmm; svg.appendChild(tx);
  }

  // Interactive Hover for Profile
  const tooltip = document.getElementById("profile-tooltip");
  const container = document.getElementById("profile-container");

  function handleProfilePointer(e) {
    if (!N) return;
    const rect = svg.getBoundingClientRect();
    const clientX = e.clientX - rect.left;
    const clientY = e.clientY - rect.top;
    const scaleX = 360 / rect.width;
    const svgX = clientX * scaleX;
    
    let distVal = (svgX - ml) * dMax / pw;
    if (distVal < 0) distVal = 0;
    if (distVal > dMax) distVal = dMax;
    
    let bestIdx = 0, minDist = Infinity;
    for(let i=0; i<N; i+=2) {
      const diff = Math.abs(D.dist[i] - distVal);
      if(diff < minDist) { minDist = diff; bestIdx = i; }
    }
    
    if(svgX >= ml - 5 && svgX <= 360 - mr + 5) {
      tooltip.style.left = clientX + "px";
      tooltip.style.top = clientY + "px";
      tooltip.innerHTML = `HR ${D.hr[bestIdx]} <span style="color:#A39E93;margin:0 4px">|</span> ${(D.dist[bestIdx]/1000).toFixed(2)}${t('km')} <span style="color:#A39E93;margin:0 4px">|</span> ${Math.round(D.alt[bestIdx])}m`;
      tooltip.style.display = "block";
    } else {
      tooltip.style.display = "none";
    }
  }
  
  container.addEventListener("mousemove", handleProfilePointer);
  container.addEventListener("touchmove", (e) => {
    if(tooltip.style.display === "block") e.preventDefault();
    handleProfilePointer(e.touches[0]);
  }, {passive: false});
  container.addEventListener("mouseleave", () => tooltip.style.display="none");
  container.addEventListener("touchend", () => tooltip.style.display="none");
}

      `${k + 1}. km ${(D.dist[w.idx] / 1000).toFixed(2)} · ${localizeText(w.title) || w.tKey || ""}: ${localizeText(w.tip) || ""}`).join("\n");
    const history = await CoachChat.trainingLog("");
    return `You are an experienced trail and road running coach. The athlete is looking at one of their Strava runs.
Run "${m.name}" on ${m.date}${m.place ? ` in ${m.place.en}` : ""}: ${m.distance_km} km, +${m.elev_gain_m} m, ${m.moving} moving, ${m.pace}/km average, HR ${m.avg_hr} avg / ${m.max_hr} max.
Coaching notes already shown on the page:
${pins}
Athlete's training history (for context):
${history}
Upcoming races: ${RACES.map(r => `${r.name.en} on ${r.date}`).join(", ") || "none"}.`;
  }
});

function boot(data){
  const s = data.streams || {};
  const meta = data.meta || {};
  D = {
    location: s.location, hr: s.hr, alt: s.alt, dist: s.dist,
    vel: s.vel, grade: s.grade, time: s.time,
    meta: {
      ...meta,
      id:data.id, name:data.name, sport:data.sport, date:data.date,
      distance_km:data.distance_km, elev_gain_m:data.elev_gain_m,
      moving:data.moving, pace:data.pace, avg_hr:data.avg_hr,
      max_hr:data.max_hr, calories:data.calories,
      place:data.place, photos:data.photos || []
    }
  };
  if(!D.location || !D.location.length) throw new Error("no location stream");
  computeBounds();
  buildWaypoints();
  document.getElementById("status").style.display="none";
  document.getElementById("content").style.display="";
  setLang(LANG);
  renderMap();
  renderProfile();
  renderPhotos();
}

// Strava photos (URLs saved by tools/enrich.js). Tap a thumbnail for the full-size viewer.
function renderPhotos(){
  const list = D.meta.photos || [], card = document.getElementById("photos-card"), box = document.getElementById("photos");
  card.hidden = !list.length;
  box.innerHTML = "";
  box.classList.toggle("one", list.length === 1);
  list.forEach((p, i) => {
    const b = document.createElement("button");
    b.type = "button";
    const img = document.createElement("img");
    img.src = p.url; img.loading = "lazy"; img.alt = p.caption || `${D.meta.name || "Run"} photo ${i + 1}`;
    img.referrerPolicy = "no-referrer";
    img.onerror = () => { b.remove(); if (!box.children.length) card.hidden = true; };
    b.appendChild(img);
    b.addEventListener("click", () => openLightbox(i));
    box.appendChild(b);
  });
}
let LB_I = 0;
function openLightbox(i){
  const list = D.meta.photos || [], lb = document.getElementById("lightbox");
  if (!list.length) return;
  LB_I = (i + list.length) % list.length;
  const p = list[LB_I];
  const img = lb.querySelector("img");
  img.referrerPolicy = "no-referrer"; img.src = p.url; img.alt = p.caption || "";
  lb.querySelector(".lb-cap").textContent = [p.caption, list.length > 1 ? `${LB_I + 1} / ${list.length}` : ""].filter(Boolean).join(" · ");
  lb.querySelectorAll(".lb-btn").forEach(x => x.hidden = list.length < 2);
  lb.hidden = false;
}
(function(){
  const lb = document.getElementById("lightbox");
  const close = () => { lb.hidden = true; lb.querySelector("img").removeAttribute("src"); };
  lb.querySelector(".lb-close").onclick = close;
  lb.querySelector(".lb-prev").onclick = e => { e.stopPropagation(); openLightbox(LB_I - 1); };
  lb.querySelector(".lb-next").onclick = e => { e.stopPropagation(); openLightbox(LB_I + 1); };
  lb.addEventListener("click", e => { if (e.target === lb) close(); });
  document.addEventListener("keydown", e => {
    if (lb.hidden) return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowLeft") openLightbox(LB_I - 1);
    if (e.key === "ArrowRight") openLightbox(LB_I + 1);
  });
})();

runsIndexReady
  .then(() => { if (!RUN_ID) throw new Error("no runs in runs/index.json"); })
  .then(() => fetch(`runs/${RUN_ID}.json?t=${new Date().getTime()}`, {cache:"no-cache"}))
  .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
  .then(boot)
  .catch(err=>{
    document.getElementById("status").innerHTML =
      `${t('error')} <b>${RUN_ID}</b>.<br><span style="font-size:11px;color:var(--dim)">${err.message}</span>`;
  });
setLang(LANG);
</script>
