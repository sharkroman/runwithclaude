name: Process Strava Run

on:
  repository_dispatch:
    types: [new_strava_run]
  workflow_dispatch:
    inputs:
      activity_id:
        description: 'Activity ID, "tips", "tips:<id>", "report:<id>" to resend a coach report, or "strava_code:<code>" to re-authorise Strava (optional; empty fetches the 10 most recent)'
        required: false
  # Poll Strava every 30 minutes; runs with nothing new make no AI calls.
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write
  issues: write

# One run at a time, so commits and the Strava token rotation never race.
concurrency:
  group: process-run
  cancel-in-progress: false

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Fetch Script
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
          BEDROCK_MODEL: ${{ vars.BEDROCK_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          # Passed via env (never interpolated into the script) to avoid shell injection.
          DISPATCH_ACTIVITY_ID: ${{ github.event.client_payload.activity_id }}
          INPUT_ACTIVITY_ID: ${{ github.event.inputs.activity_id }}
        run: |
          ACTIVITY_ID="${DISPATCH_ACTIVITY_ID:-$INPUT_ACTIVITY_ID}"
          if [ -z "$ACTIVITY_ID" ]; then
            node tools/backfill.js
          elif [[ "$ACTIVITY_ID" =~ ^strava_code:([A-Za-z0-9]+)$ ]]; then
            # Re-authorisation: swap the one-time OAuth code for a refresh token (saved to the repo
            # secret by the sync step below), then fetch recent runs with it.
            STRAVA_REFRESH_TOKEN=$(STRAVA_CODE="${BASH_REMATCH[1]}" node -e '
              (async () => {
                const r = await fetch("https://www.strava.com/oauth/token", { method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ client_id: process.env.STRAVA_CLIENT_ID, client_secret: process.env.STRAVA_CLIENT_SECRET,
                                         code: process.env.STRAVA_CODE, grant_type: "authorization_code" }) });
                const j = await r.json().catch(() => ({}));
                if (!r.ok || !j.refresh_token) { console.error(`Strava code exchange failed: ${r.status} ${JSON.stringify(j.errors || j.message || "")}`); process.exit(1); }
                require("fs").writeFileSync(".strava-refresh-token", j.refresh_token);
                process.stdout.write(j.refresh_token);
              })();') || exit 1
            echo "::add-mask::$STRAVA_REFRESH_TOKEN"
            export STRAVA_REFRESH_TOKEN
            node tools/backfill.js
          elif [[ "$ACTIVITY_ID" =~ ^report:([0-9]+)$ ]]; then
            echo "${BASH_REMATCH[1]}" > .new-runs
          elif [[ "$ACTIVITY_ID" =~ ^([0-9]+|tips|tips:[0-9]+)$ ]]; then
            node tools/backfill.js "$ACTIVITY_ID"
          else
            echo "::error::Invalid activity_id. Expected digits, 'tips', 'tips:<digits>', 'report:<digits>', or 'strava_code:<code>'."
            exit 1
          fi

      - name: Build run summary for the AI coach
        run: node tools/summary.js || echo "::warning::tools/summary.js failed; runs/summary.json not updated"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add runs/
          git commit -m "Auto-update Strava runs via Action" || exit 0
          # Another run may have pushed meanwhile; rebase and retry. A conflict can only be
          # in runs/index.json, which is rebuilt from the run files.
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            sleep $((attempt * 5))
            git fetch origin main
            if ! git rebase origin/main; then
              node -e '
                const fs = require("fs");
                const idx = fs.readdirSync("runs").filter(f => /^\d+\.json$/.test(f)).map(f => {
                  const r = JSON.parse(fs.readFileSync("runs/" + f, "utf8"));
                  return { id: r.id, name: r.name, date: r.date, distance_km: r.distance_km };
                }).sort((a, b) => new Date(b.date) - new Date(a.date));
                fs.writeFileSync("runs/index.json", JSON.stringify(idx, null, 2));'
              node tools/summary.js || true
              git add runs/index.json runs/summary.json
              GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
            fi
          done
          echo "::error::Could not push after 5 attempts."
          exit 1

      # Opens one GitHub issue per newly saved run; GitHub then emails / pushes it to the owner.
      - name: Send coach report
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPORT_MENTION: ${{ github.repository_owner }}
        run: |
          [ -f .new-runs ] || { echo "No new runs."; exit 0; }
          while read -r id; do
            [[ "$id" =~ ^[0-9]+$ ]] || continue
            title=$(node -e 'const r=require("./runs/"+process.argv[1]+".json");console.log(`Coach report: ${r.name} (${r.date.slice(0,10)}, ${r.distance_km} km)`)' "$id")
            node tools/report.js "$id" > report.md
            gh issue create --repo "$REPO" --title "$title" --body-file report.md
          done < .new-runs
          rm -f .new-runs report.md

      # Runs even if the fetch failed: Strava may have rotated the token before the failure,
      # and losing the new token would break every later run.
      - name: Sync rotated Strava token to repo secret
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -f .strava-refresh-token ]; then
            echo "No token rotation detected."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Strava rotated the refresh token but the GH_PAT secret is missing. Update STRAVA_REFRESH_TOKEN manually or the next run will fail."
            rm -f .strava-refresh-token
            exit 1
          fi
          if ! gh secret set STRAVA_REFRESH_TOKEN --body "$(cat .strava-refresh-token)" --repo "$REPO"; then
            echo "::error::Failed to update STRAVA_REFRESH_TOKEN secret. Check that GH_PAT has Secrets read/write on this repo."
            rm -f .strava-refresh-token
            exit 1
          fi
          rm -f .strava-refresh-token
          echo "Secret updated with rotated token."
