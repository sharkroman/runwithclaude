name: Process Strava Run

on:
  repository_dispatch:
    types: [new_strava_run]
  workflow_dispatch:
    inputs:
      activity_id:
        description: 'Activity ID, "tips", or "tips:<id>" (optional; empty fetches the 10 most recent)'
        required: false

permissions:
  contents: write

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Fetch Script
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          # Passed via env (never interpolated into the script) to avoid shell injection.
          DISPATCH_ACTIVITY_ID: ${{ github.event.client_payload.activity_id }}
          INPUT_ACTIVITY_ID: ${{ github.event.inputs.activity_id }}
        run: |
          ACTIVITY_ID="${DISPATCH_ACTIVITY_ID:-$INPUT_ACTIVITY_ID}"
          if [ -z "$ACTIVITY_ID" ]; then
            node tools/backfill.js
          elif [[ "$ACTIVITY_ID" =~ ^([0-9]+|tips|tips:[0-9]+)$ ]]; then
            node tools/backfill.js "$ACTIVITY_ID"
          else
            echo "::error::Invalid activity_id. Expected digits, 'tips', or 'tips:<digits>'."
            exit 1
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add runs/
          git commit -m "Auto-update Strava runs via Action" || exit 0
          git push

      # Runs even if the fetch failed: Strava may have rotated the token before the failure,
      # and losing the new token would break every later run.
      - name: Sync rotated Strava token to repo secret
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -f .strava-refresh-token ]; then
            echo "No token rotation detected."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Strava rotated the refresh token but the GH_PAT secret is missing. Update STRAVA_REFRESH_TOKEN manually or the next run will fail."
            rm -f .strava-refresh-token
            exit 1
          fi
          if ! gh secret set STRAVA_REFRESH_TOKEN --body "$(cat .strava-refresh-token)" --repo "$REPO"; then
            echo "::error::Failed to update STRAVA_REFRESH_TOKEN secret. Check that GH_PAT has Secrets read/write on this repo."
            rm -f .strava-refresh-token
            exit 1
          fi
          rm -f .strava-refresh-token
          echo "Secret updated with rotated token."
